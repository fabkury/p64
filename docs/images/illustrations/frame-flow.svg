<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350" role="img" aria-labelledby="title desc">
<title id="title">From source to LEDs</title><desc id="desc">Core 0 loads file bytes. Core 1 player decodes, scales and overlays. The ready ring passes frames to the renderer; HUB75 DMA drives the panel.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#24618a"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#182c3d"><text x="24" y="38" font-size="25" text-anchor="start">From source to LEDs</text><rect x="24" y="80" width="235" height="82" rx="8" fill="#eff6fb" stroke="#8aa6bb"/><text x="141.5" y="112" font-size="20" text-anchor="middle">Core 0 · loader</text><text x="141.5" y="139" font-size="16" text-anchor="middle">file bytes in PSRAM</text><path d="M259 121 L315 121" fill="none" stroke="#24618a" stroke-width="2" marker-end="url(#arrow)"/><rect x="325" y="80" width="245" height="82" rx="8" fill="#eff6fb" stroke="#8aa6bb"/><text x="447.5" y="112" font-size="20" text-anchor="middle">Core 1 · player</text><text x="447.5" y="139" font-size="16" text-anchor="middle">decode, scale, overlay</text><path d="M570 121 L625 121" fill="none" stroke="#24618a" stroke-width="2" marker-end="url(#arrow)"/><rect x="635" y="80" width="240" height="82" rx="8" fill="#eff6fb" stroke="#8aa6bb"/><text x="755.0" y="112" font-size="20" text-anchor="middle">Ready ring</text><text x="755.0" y="139" font-size="16" text-anchor="middle">frame + due time</text><path d="M755 162 L755 225" fill="none" stroke="#24618a" stroke-width="2" marker-end="url(#arrow)"/><rect x="635" y="235" width="240" height="82" rx="8" fill="#eff6fb" stroke="#8aa6bb"/><text x="755.0" y="267" font-size="20" text-anchor="middle">Core 1 · renderer</text><text x="755.0" y="294" font-size="16" text-anchor="middle">rotation, gains, present</text><path d="M635 276 L580 276" fill="none" stroke="#24618a" stroke-width="2" marker-end="url(#arrow)"/><rect x="325" y="235" width="245" height="82" rx="8" fill="#eff6fb" stroke="#8aa6bb"/><text x="447.5" y="267" font-size="20" text-anchor="middle">HUB75 DMA</text><text x="447.5" y="294" font-size="16" text-anchor="middle">continuous panel refresh</text><text x="24" y="208" font-size="17" text-anchor="start">Widgets and streams also</text><text x="24" y="234" font-size="17" text-anchor="start">supply a FrameSource.</text></g></svg>
