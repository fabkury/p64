<svg xmlns="http://www.w3.org/2000/svg" width="900" height="235" viewBox="0 0 900 235" role="img" aria-labelledby="title desc">
<title id="title">Live pixels over Wi-Fi</title><desc id="desc">A computer sends DDP on UDP 4048 or raw p64 on UDP 4064. Silence timeout returns to the previous mode.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#24618a"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#182c3d"><text x="24" y="38" font-size="25" text-anchor="start">Live pixels over Wi-Fi</text><rect x="24" y="82" width="215" height="82" rx="8" fill="#eff6fb" stroke="#8aa6bb"/><text x="131.5" y="114" font-size="20" text-anchor="middle">Computer</text><text x="131.5" y="141" font-size="16" text-anchor="middle">file, test or screen</text><path d="M239 123 L645 123" fill="none" stroke="#24618a" stroke-width="2" marker-end="url(#arrow)"/><text x="442" y="90" font-size="18" text-anchor="middle">DDP · UDP 4048</text><text x="442" y="154" font-size="18" text-anchor="middle">raw p64 · UDP 4064</text><rect x="655" y="82" width="220" height="82" rx="8" fill="#eff6fb" stroke="#8aa6bb"/><text x="765.0" y="114" font-size="20" text-anchor="middle">p64</text><text x="765.0" y="141" font-size="16" text-anchor="middle">stream takeover</text><text x="450" y="208" font-size="18" text-anchor="middle">Silence timeout → previous mode</text></g></svg>
