<g font-family="Arial, Helvetica, sans-serif" fill="#182c3d"><text x="24" y="38" font-size="25" text-anchor="start">Channels → playset → artwork</text><rect x="24" y="72" width="220" height="82" rx="8" fill="#eff6fb" stroke="#8aa6bb"/><text x="134.0" y="104" font-size="20" text-anchor="middle">Local folder</text><text x="134.0" y="131" font-size="16" text-anchor="middle">weight 2</text><rect x="24" y="180" width="220" height="82" rx="8" fill="#eff6fb" stroke="#8aa6bb"/><text x="134.0" y="212" font-size="20" text-anchor="middle">Promoted</text><text x="134.0" y="239" font-size="16" text-anchor="middle">weight 1</text><path d="M244 113 L335 153" fill="none" stroke="#24618a" stroke-width="2" marker-end="url(#arrow)"/><path d="M244 221 L335 163" fill="none" stroke="#24618a" stroke-width="2" marker-end="url(#arrow)"/><rect x="345" y="117" width="210" height="82" rx="8" fill="#eff6fb" stroke="#8aa6bb"/><text x="450.0" y="149" font-size="20" text-anchor="middle">Your playset</text><text x="450.0" y="176" font-size="16" text-anchor="middle">weighted channel picks</text><path d="M555 158 L625 158" fill="none" stroke="#24618a" stroke-width="2" marker-end="url(#arrow)"/><rect x="635" y="117" width="240" height="82" rx="8" fill="#eff6fb" stroke="#8aa6bb"/><text x="755.0" y="149" font-size="20" text-anchor="middle">Artwork slot</text><text x="755.0" y="176" font-size="16" text-anchor="middle">or a widget interlude</text></g></svg>
